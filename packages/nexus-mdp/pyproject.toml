[project]
name = "nexus-mdp"
version = "0.1.0"
description = "The MDP contract: observation encoding, action decoding, reward, and version. No gym, no services."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "nexus-errors", "nexus-sim", "nexus-types"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_mdp"]
