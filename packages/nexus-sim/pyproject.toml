[project]
name = "nexus-sim"
version = "0.1.0"
description = "Flow-level network simulator. Pure, deterministic given a seed. No services, no gym, no LLM."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "nexus-errors", "nexus-types"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_sim"]
