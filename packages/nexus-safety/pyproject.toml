[project]
name = "nexus-safety"
version = "0.1.0"
description = "Runtime guardrails: hard action bounds, breach detection, fallback activation, drift monitoring."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "nexus-errors", "nexus-types"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_safety"]
