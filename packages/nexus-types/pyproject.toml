[project]
name = "nexus-types"
version = "0.1.0"
description = "Pydantic contracts crossing NEXUS-RL service boundaries."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "nexus-errors"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_types"]
