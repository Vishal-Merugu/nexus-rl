[project]
name = "nexus-baselines"
version = "0.1.0"
description = "Non-learned allocators. The comparison floor every policy claim is stated against."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "nexus-errors", "nexus-sim", "nexus-types"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_baselines"]
