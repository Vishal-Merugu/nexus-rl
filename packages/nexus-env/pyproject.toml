[project]
name = "nexus-env"
version = "0.1.0"
description = "Gymnasium environment wrapping nexus-sim against the nexus-mdp contract. Training only."
requires-python = ">=3.12"
dependencies = ["gymnasium>=1.0", "numpy>=2.0", "nexus-errors", "nexus-mdp", "nexus-sim", "nexus-types"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_env"]
