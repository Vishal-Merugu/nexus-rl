# The only externally exposed component. Static assets, so it scales freely and holds nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: nexus-rl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      containers:
        - name: dashboard
          image: nexus-rl/dashboard:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-dashboard
spec:
  # NodePort keeps a kind/minikube demo reachable without an ingress controller.
  type: NodePort
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
