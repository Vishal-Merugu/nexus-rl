[project]
name = "nexus-rl"
version = "0.1.0"
description = "Training and evaluation harness. Config loading, run artifacts, baseline comparison."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "nexus-baselines",
    "nexus-env",
    "nexus-mdp",
    "nexus-errors",
    "nexus-registry",
    "nexus-sim",
    "nexus-telemetry",
    "nexus-types",
]

[project.optional-dependencies]
# torch is large. Only the training path needs it — evaluation against baselines runs without it, which
# keeps the controller and simulator images small.
train = ["stable-baselines3>=2.4", "torch>=2.5"]

[project.scripts]
nexus-train = "nexus_rl.train:main"
nexus-eval = "nexus_rl.evaluate:main"
nexus-registry = "nexus_rl.registry_cli:main"
nexus-train-marl = "nexus_rl.train_marl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_rl"]
