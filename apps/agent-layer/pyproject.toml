[project]
name = "nexus-agent"
version = "0.1.0"
description = "Agent layer — MCP tools exposing the orchestrator to an LLM under constrained authority."
requires-python = ">=3.12"
dependencies = [
    # Pinned below 2.0 deliberately. mcp 2.x drops the lowlevel `@server.list_tools()` /
    # `@server.call_tool()` decorators this module is built on, and its `MCPServer.add_tool` infers the
    # tool schema from a function signature instead of taking an explicit pydantic model. That inference
    # is incompatible with the enforced-schema design in ADR-0003, so the 2.x port is a deliberate
    # redesign rather than a version bump. Unpinned, `>=1.2` resolved to 2.0.0 and the server failed to
    # start — no test covered `build_server`, so nothing caught it.
    "mcp>=1.2,<2",
    "httpx>=0.28",
    "pydantic>=2.10",
    "nexus-config",
    "nexus-errors",
    "nexus-telemetry",
    "nexus-types",
]

[project.scripts]
nexus-agent-server = "nexus_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_agent"]
