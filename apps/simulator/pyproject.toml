[project]
name = "nexus-simulator"
version = "0.1.0"
description = "Simulator service — the single writer of simulation state."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "nexus-config",
    "nexus-errors",
    "nexus-sim",
    "nexus-telemetry",
    "nexus-types",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_simulator"]
