[project]
name = "nexus-controller"
version = "0.1.0"
description = "Controller service — hosts the policy, owns active constraints."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "numpy>=2.0",
    "nexus-baselines",
    "nexus-config",
    "nexus-env",
    "nexus-errors",
    "nexus-telemetry",
    "nexus-types",
]

[project.optional-dependencies]
# Only needed to serve a trained checkpoint. Without it the controller runs on the static baseline.
policy = ["stable-baselines3>=2.4", "torch>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_controller"]
