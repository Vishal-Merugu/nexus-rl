[project]
name = "nexus-config"
version = "0.1.0"
description = "The only place NEXUS-RL reads environment variables."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "pydantic-settings>=2.7", "nexus-errors"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_config"]
