[project]
name = "nexus-a1"
version = "0.1.0"
description = "The A1 interface contract: versioned policy documents the Non-RT tier issues to the Near-RT tier."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "nexus-errors", "nexus-types"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_a1"]
