# Singleton in v1: inference is stateless and would scale, but active constraints are per-process state.
# Making the controller horizontally scalable means moving constraints to shared storage — an ADR, not a
# replica-count change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-controller
  labels:
    app.kubernetes.io/name: controller
    app.kubernetes.io/part-of: nexus-rl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controller
    spec:
      containers:
        - name: controller
          image: nexus-rl/controller:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "nexus_controller.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          resources:
            requests:
              cpu: 500m
              # Torch is memory-hungry. An unbounded container gets OOM-killed on a kind cluster and the
              # failure looks mysterious.
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            # Loading a checkpoint takes time. Not-ready, not dead.
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: controller
  ports:
    - port: 8001
      targetPort: 8001
