[project]
name = "nexus-controller"
version = "0.1.0"
description = "Controller service — hosts the policy, owns active constraints."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "numpy>=2.0",
    "nexus-baselines",
    "nexus-config",
    # nexus-mdp, not nexus-env. The controller needs the MDP *codec* (observation encoding, action
    # decoding, MDP_VERSION) and never constructs a gymnasium Env — see ADR-0007. It previously declared
    # nexus-env, which it did not import, and reached nexus_mdp transitively through it: the declared
    # graph pulled gymnasium into a service that has no use for it, which is precisely the coupling the
    # nexus-mdp / nexus-env split exists to end.
    "nexus-mdp",
    "nexus-errors",
    "nexus-telemetry",
    "nexus-types",
    "nexus-a1",
    "nexus-registry",
]

[project.optional-dependencies]
# Only needed to serve a trained checkpoint. Without it the controller runs on the static baseline.
policy = ["stable-baselines3>=2.4", "torch>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_controller"]
