[project]
name = "nexus-supervisor"
version = "0.1.0"
description = "Safety supervisor — an independent guardrail in the fast control path."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "nexus-baselines",
    "nexus-config",
    "nexus-errors",
    "nexus-safety",
    "nexus-telemetry",
    "nexus-types",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_supervisor"]
