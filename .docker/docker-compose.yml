# Local development stack.
#
# Ports are overridable so a conflicting local service does not require editing this file:
#   SIMULATOR_HOST_PORT=8010 docker compose -f .docker/docker-compose.yml up -d
#
# The agent layer reaches an Ollama running on the **host** via host.docker.internal. Nothing here needs
# an API key or an account (ADR-0005).

name: nexus-rl

services:
  simulator:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.python
      args:
        SERVICE_PATH: apps/simulator
    command: uvicorn nexus_simulator.main:app --host 0.0.0.0 --port 8000
    environment:
      NEXUS_ENV: development
      NEXUS_SEED: ${NEXUS_SEED:-1337}
      NEXUS_TOPOLOGY: ${NEXUS_TOPOLOGY:-mesh-6}
      NEXUS_CONTROLLER_URL: http://controller:8001
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
    ports:
      - "${SIMULATOR_HOST_PORT:-8000}:8000"
    healthcheck:
      # Reports the actual timestep and whether the controller is reachable — not an unconditional 200.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      controller:
        condition: service_healthy

  controller:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.python
      args:
        SERVICE_PATH: apps/controller
        # Uncomment to serve a trained checkpoint. Adds torch — a much larger image.
        # EXTRAS: policy
    command: uvicorn nexus_controller.main:app --host 0.0.0.0 --port 8001
    environment:
      NEXUS_ENV: development
      NEXUS_SEED: ${NEXUS_SEED:-1337}
      NEXUS_TOPOLOGY: ${NEXUS_TOPOLOGY:-mesh-6}
      # Empty: falls back to the static baseline and says so on /health. Set to a checkpoint path
      # (mounted below) to serve a trained policy.
      NEXUS_POLICY_PATH: ${NEXUS_POLICY_PATH:-}
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
    volumes:
      - ../experiments/runs:/app/experiments/runs:ro
    ports:
      - "${CONTROLLER_HOST_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  agent-layer:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.python
      args:
        SERVICE_PATH: apps/agent-layer
    command: nexus-agent-server
    environment:
      NEXUS_ENV: development
      NEXUS_SIMULATOR_URL: http://simulator:8000
      NEXUS_CONTROLLER_URL: http://controller:8001
      # Ollama on the host. Override for a hosted provider — two variables, no code change.
      NEXUS_LLM_BASE_URL: ${NEXUS_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      NEXUS_LLM_MODEL: ${NEXUS_LLM_MODEL:-qwen2.5:7b}
      NEXUS_LLM_API_KEY: ${NEXUS_LLM_API_KEY:-}
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    depends_on:
      simulator:
        condition: service_healthy

  dashboard:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_SIMULATOR_WS: ws://localhost:${SIMULATOR_HOST_PORT:-8000}/ws
    volumes:
      - ../apps/dashboard:/app
      - dashboard_modules:/app/node_modules
    ports:
      - "${DASHBOARD_HOST_PORT:-5173}:5173"
    depends_on:
      simulator:
        condition: service_healthy

volumes:
  dashboard_modules:
