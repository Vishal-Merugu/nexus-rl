[project]
name = "nexus-telemetry"
version = "0.1.0"
description = "Structured logging and run-metric emission for NEXUS-RL."
requires-python = ">=3.12"
dependencies = ["nexus-errors"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_telemetry"]
