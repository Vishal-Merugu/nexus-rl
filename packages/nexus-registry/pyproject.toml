[project]
name = "nexus-registry"
version = "0.1.0"
description = "Model registry: versioned policy artifacts with provenance, evaluation scores and deployment stage."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "nexus-errors"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_registry"]
