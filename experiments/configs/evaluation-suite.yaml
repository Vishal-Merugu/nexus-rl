# The reproducible evaluation suite.
#
# Every policy version is scored against exactly this scenario set before it can be promoted. That is the
# whole point: two versions are comparable only if they met the same problem, and "the same problem" has to
# be a versioned artifact rather than whatever flags someone typed.
#
# Changing any scenario, seed count, or step count makes previously recorded scores incomparable to new
# ones. Bump `suite_version` when you do, exactly as with MDP_VERSION — the registry records the suite
# version alongside every score so a stale comparison is visible rather than silent.
#
# History:
#   1 — initial. mesh-6 / 8 flows, five seeds, four patterns covering trained and held-out distributions.

name: standard
suite_version: 1

topology: mesh-6
flow_count: 8
steps: 512
seeds: 5

# Four patterns, and `diurnal` is the one policies are usually trained on. The other three are held out on
# purpose: a policy scored only where it trained has demonstrated memorisation, not competence, and the
# per-pattern breakdown in the registry is where that shows up.
patterns:
  - diurnal
  - flash_crowd
  - bursty
  - steady

baselines:
  - static
  - round_robin
  - greedy_throughput
