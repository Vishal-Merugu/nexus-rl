[project]
name = "nexus-errors"
version = "0.1.0"
description = "NexusError hierarchy. Every error raised anywhere in NEXUS-RL subclasses one of these."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_errors"]
